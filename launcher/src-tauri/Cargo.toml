[package]
name = "launcher-1227"
version = "0.1.0"
description = "1227 Launcher"
edition = "2021"
license = "MIT"

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
futures-util = "0.3"
rfd = "0.15"
dirs = "5"
url = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
