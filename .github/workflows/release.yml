name: Release

# Push a tag like v1.12.0 (matching build.gradle's version) to publish:
#   1. builds the mod jar, 2. creates the GitHub Release with the jar,
#   3. writes the SHA-256/size entry into api/data/manifest.json and commits it,
#   4. deploys the API worker if the CLOUDFLARE_API_TOKEN secret is set.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Install Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
      - name: Check tag matches build.gradle
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "version = \"$V\"" build.gradle || { echo "Tag $V does not match build.gradle"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradle-2.14.1/bin/gradle setupCIWorkspace build --no-daemon
      - name: Pick the reobfuscated jar
        run: |
          JAR=$(ls build/libs/1227-${VERSION}.jar)
          cp "$JAR" "1227-${VERSION}.jar"
          sha256sum "1227-${VERSION}.jar" | tee "1227-${VERSION}.jar.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            1227-${{ env.VERSION }}.jar
            1227-${{ env.VERSION }}.jar.sha256
      - name: Update manifest
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/1227-${VERSION}.jar"
          python3 tools/manifest_entry.py "1227-${VERSION}.jar" "$VERSION" "$URL" "Veja o changelog no README."
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add api/data/manifest.json
          git commit -m "manifest: v${VERSION}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
      - name: Deploy API
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
