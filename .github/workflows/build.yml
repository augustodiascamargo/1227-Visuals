name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Install Gradle 2.14.1 (required by ForgeGradle 2.x)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
      - name: Build (reobfuscated jar)
        run: ./gradle-2.14.1/bin/gradle setupCIWorkspace build --no-daemon
      - name: Package (mod jar + Windows installer launcher)
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          cp "installer-windows/Instalar 1227.bat" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: 1227-jar
          path: dist/

  relay-plugin:
    # server/1227-relay: the optional Spigot/Paper plugin for 1227 Link (multiplayer emotes and cosmetics)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Build the relay plugin
        run: mvn -B -q -f server/1227-relay/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: 1227-relay-plugin
          path: server/1227-relay/target/1227-relay-*.jar
